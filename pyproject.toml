[project]
name = "gambit-mcp"
version = "0.1.0"
description = "Production-oriented MCP server for bounded Gambit research workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "mcp==2.2.0",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
]

[project.scripts]
"gambit-mcp" = "gambit_mcp.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "jsonschema[format-nongpl]==4.26.0",
  "pyright==1.1.414",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gambit_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
